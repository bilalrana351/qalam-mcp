[project]
name = "qalam-mcp"
version = "0.1.0"
description = "A personal, reusable-session MCP server for NUST Qalam and the NUST LMS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14,<5",
    "certifi>=2024.2",
    "filelock>=3.20,<4",
    "httpx>=0.28,<1",
    "mcp>=1.26,<2",
    "platformdirs>=4,<5",
    "playwright>=1.58,<2",
]

[project.scripts]
qalam-mcp = "qalam_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
